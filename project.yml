name: CH348
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: SV4P7RNRDK
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_C_LANGUAGE_STANDARD: c11
targets:
  CH348Driver:
    type: driver-extension
    platform: macOS
    sources:
      - path: Driver
        excludes: [Info.plist, Driver.entitlements]
      - path: Protocol
    settings:
      base:
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "23.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.idy.ch348-macos.driver
        PRODUCT_NAME: com.idy.ch348-macos.driver
        INFOPLIST_FILE: Driver/Info.plist
        CODE_SIGN_ENTITLEMENTS: Driver/Driver.entitlements
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Protocol"]
        IIG_FRAMEWORK_NAME: CH348Driver
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: DriverKit.framework
      - sdk: USBDriverKit.framework
      - sdk: SerialDriverKit.framework
  CH348Installer:
    type: application
    platform: macOS
    sources: [Installer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idy.ch348-macos
        PRODUCT_NAME: CH348
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CH348 Serial Driver
        CODE_SIGN_ENTITLEMENTS: Installer/Installer.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: CH348Driver
        embed: true
        codeSign: true
      - sdk: SystemExtensions.framework
schemes:
  CH348:
    build:
      targets:
        CH348Installer: all
