name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Website release link tests
        run: node --test Tests/test_site.js
      - name: Protocol and serial ring tests
        run: scripts/test.sh
      - name: Build universal native driver and installer without signing
        run: scripts/build.sh --unsigned
      - name: Package and verify unsigned installer
        run: python3 scripts/package.py --unsigned
      - name: Upload unsigned PKG and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CH348-macos-universal-unsigned-pkg
          path: |
            build/packages/*-unsigned.pkg
            build/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
